<style>text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
<rect x="1" y="1" width="1198" height="398" rx="20" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity=".3"/>
<text x="56" y="70" font-size="13" font-weight="700" fill="#2dd4bf" letter-spacing="2">RESEARCH HIGHLIGHT · MSC THESIS</text>
<text x="56" y="118" font-size="34" font-weight="800" fill="#f1f5f9">What does privacy cost?</text>
<text x="56" y="152" font-size="16" fill="#a3b0c4">Mental health text classification across 5 uneven clients.</text>
<text x="56" y="214" font-size="24" font-weight="800" fill="#5eead4">1.7</text><text x="186" y="214" font-size="15.5" fill="#a3b0c4">F1 points lost to federation alone</text><text x="56" y="266" font-size="24" font-weight="800" fill="#5eead4">14.1</text><text x="186" y="266" font-size="15.5" fill="#a3b0c4">points lost when differential privacy is added</text><text x="56" y="318" font-size="24" font-weight="800" fill="#5eead4">3.55 MB</text><text x="186" y="318" font-size="15.5" fill="#a3b0c4">per round instead of 502 MB, using LoRA</text>
<text x="760" y="84" font-size="14" font-weight="600" fill="#a3b0c4">Macro F1 score</text>
<text x="1120" y="84" font-size="12" fill="#64748b" text-anchor="end">higher is better</text>
<text x="744" y="137" font-size="15" fill="#a3b0c4" text-anchor="end">Centralised</text><rect x="760" y="118" width="360" height="28" rx="4" fill="#ffffff" fill-opacity=".04"/><rect x="760" y="118" width="316.1" height="28" rx="4" fill="#5eead4"></rect><text x="1086.1" y="137" font-size="15" font-weight="700" fill="#f1f5f9">0.878</text><text x="744" y="195" font-size="15" fill="#a3b0c4" text-anchor="end">Federated</text><rect x="760" y="176" width="360" height="28" rx="4" fill="#ffffff" fill-opacity=".04"/><rect x="760" y="176" width="310.0" height="28" rx="4" fill="#2dd4bf"></rect><text x="1080.0" y="195" font-size="15" font-weight="700" fill="#f1f5f9">0.861</text><text x="744" y="253" font-size="15" fill="#a3b0c4" text-anchor="end">DP  ε = 8</text><rect x="760" y="234" width="360" height="28" rx="4" fill="#ffffff" fill-opacity=".04"/><rect x="760" y="234" width="259.2" height="28" rx="4" fill="#14b8a6"></rect><text x="1029.2" y="253" font-size="15" font-weight="700" fill="#f1f5f9">0.720</text><text x="744" y="311" font-size="15" fill="#a3b0c4" text-anchor="end">DP  ε = 1</text><rect x="760" y="292" width="360" height="28" rx="4" fill="#ffffff" fill-opacity=".04"/><rect x="760" y="292" width="212.0" height="28" rx="4" fill="#0d9488"></rect><text x="982.0" y="311" font-size="15" font-weight="700" fill="#f1f5f9">0.589</text>
<text x="760" y="368" font-size="12" fill="#64748b">ε is the privacy budget. Smaller ε means stronger privacy.</text>

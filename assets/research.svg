<text x="56" y="70" font-size="13" font-weight="700" fill="#ffc861" letter-spacing="2">RESEARCH HIGHLIGHT · MSC THESIS</text>
<text x="56" y="118" font-size="34" font-weight="800" fill="#f6efe4">What does privacy cost?</text>
<text x="56" y="152" font-size="16" fill="#b9c3d3">Mental health text classification across 5 uneven clients.</text>
<text x="56" y="222" font-size="24" font-weight="800" fill="#ffc861">1.7</text><text x="186" y="222" font-size="15.5" fill="#b9c3d3">F1 points lost to federation alone</text><text x="56" y="274" font-size="24" font-weight="800" fill="#ffc861">14.1</text><text x="186" y="274" font-size="15.5" fill="#b9c3d3">points lost when differential privacy is added</text><text x="56" y="326" font-size="24" font-weight="800" fill="#ffc861">3.55 MB</text><text x="186" y="326" font-size="15.5" fill="#b9c3d3">per round instead of 502 MB, using LoRA</text>
<text x="770" y="82" font-size="14" font-weight="600" fill="#b9c3d3">Macro F1 score</text>
<text x="1110" y="82" font-size="12" fill="#7a879c" text-anchor="end">higher is better</text>
<text x="754" y="130" font-size="14.5" fill="#b9c3d3" text-anchor="end">Centralised</text><rect x="770" y="112" width="340" height="26" rx="4" fill="#ffffff" fill-opacity=".045"/><rect x="770" y="112" width="298.5" height="26" rx="4" fill="#b6f4ff"/><text x="1078.5" y="130" font-size="14.5" font-weight="700" fill="#f6efe4">0.878</text><text x="754" y="180" font-size="14.5" fill="#b9c3d3" text-anchor="end">Federated</text><rect x="770" y="162" width="340" height="26" rx="4" fill="#ffffff" fill-opacity=".045"/><rect x="770" y="162" width="292.7" height="26" rx="4" fill="#8ff0ff"/><text x="1072.7" y="180" font-size="14.5" font-weight="700" fill="#f6efe4">0.861</text><text x="754" y="230" font-size="14.5" fill="#b9c3d3" text-anchor="end">DP  ε = 8</text><rect x="770" y="212" width="340" height="26" rx="4" fill="#ffffff" fill-opacity=".045"/><rect x="770" y="212" width="244.8" height="26" rx="4" fill="#3ddcff"/><text x="1024.8" y="230" font-size="14.5" font-weight="700" fill="#f6efe4">0.720</text><text x="754" y="280" font-size="14.5" fill="#b9c3d3" text-anchor="end">DP  ε = 3</text><rect x="770" y="262" width="340" height="26" rx="4" fill="#ffffff" fill-opacity=".045"/><rect x="770" y="262" width="232.6" height="26" rx="4" fill="#1fb6db"/><text x="1012.6" y="280" font-size="14.5" font-weight="700" fill="#f6efe4">0.684</text><text x="754" y="330" font-size="14.5" fill="#b9c3d3" text-anchor="end">DP  ε = 1</text><rect x="770" y="312" width="340" height="26" rx="4" fill="#ffffff" fill-opacity=".045"/><rect x="770" y="312" width="200.3" height="26" rx="4" fill="#1590b3"/><text x="980.3" y="330" font-size="14.5" font-weight="700" fill="#f6efe4">0.589</text>
<text x="770" y="374" font-size="12" fill="#7a879c">ε is the privacy budget. Smaller ε means stronger privacy.</text>
